name: Build ijkplayer (硬解 + MP2)

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    timeout-minutes: 120
    steps:
      - name: 安装依赖
        run: |
          apt-get update
          apt-get install -y git make yasm unzip curl ca-certificates libncurses6 libtinfo6 file python2 openjdk-11-jdk-headless linux-libc-dev
          # 解决 libncurses.so.5 缺失：NDK r14b 的 gcc 是 64 位二进制，
          # 需要 64 位 .so.5，但系统只有 .so.6。先确认 .so.6 存在，再软链接
          ls -la /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.6
          ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          ln -sf /usr/lib/x86_64-linux-gnu/libncursesw.so.6 /usr/lib/x86_64-linux-gnu/libncursesw.so.5
          # python 命令指向 python2（NDK 的 make_standalone_toolchain.py 是 python2 脚本）
          ln -sf /usr/bin/python2 /usr/bin/python
          # jni.h 软链接到系统 include（FFmpeg configure 的 --enable-jni 需要）
          ln -sf /usr/lib/jvm/java-11-openjdk-amd64/include/jni.h /usr/include/jni.h
          ln -sf /usr/lib/jvm/java-11-openjdk-amd64/include/linux/jni_md.h /usr/include/jni_md.h
          ldconfig
          echo "=== 确认 ==="
          ls -la /usr/lib/x86_64-linux-gnu/libncurses.so.5 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          python --version 2>&1 || true

      - name: 下载 Android NDK r14b
        run: |
          cd /root
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip
          unzip -q ndk.zip
          echo "NDK ready: /root/android-ndk-r14b"

      - name: 下载 ijkplayer 源码
        run: |
          cd /root
          git clone --depth 1 --branch k0.8.8 https://github.com/bilibili/ijkplayer.git ijkplayer

      - name: 修改编译配置（启用硬解 + MP2）
        run: |
          cd /root/ijkplayer/config
          rm -f module.sh
          ln -s module-default.sh module.sh
          sed -i 's/--disable-hwaccels//g' module-default.sh
          {
            echo 'export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --disable-linux-perf"'
            echo 'export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-decoder=mp2"'
            echo 'export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-decoder=mp3"'
          } >> module-default.sh
          grep -E "mediacodec|hwaccels|decoder=mp2" module-default.sh || true

      - name: 编译 FFmpeg
        run: |
          export ANDROID_NDK=/root/android-ndk-r14b
          cd /root/ijkplayer
          ./init-android.sh
          # 软链接 perf_event.h 到 NDK 所有 sysroot（解决 linux/perf_event.h 缺失）
          for d in $(find /root/android-ndk-r14b/platforms -type d -name linux); do
            ln -sf /usr/include/linux/perf_event.h "$d/perf_event.h"
          done
          # 软链接 jni.h 到 NDK 所有 sysroot（解决 --enable-jni 的 jni not found）
          for d in $(find /root/android-ndk-r14b/platforms -type d -name include); do
            ln -sf /usr/lib/jvm/java-11-openjdk-amd64/include/jni.h "$d/jni.h"
            ln -sf /usr/lib/jvm/java-11-openjdk-amd64/include/linux/jni_md.h "$d/jni_md.h"
          done
          # 全局替换 FFmpeg 源码里的 B0 为 b0（避免和 termbits.h 的 B0 波特率宏冲突）
          for f in $(find /root/ijkplayer/android/contrib -type f \( -name "*.c" -o -name "*.h" \)); do
            sed -i 's/B0/b0/g' "$f"
          done
          cd android/contrib
          ./compile-ffmpeg.sh clean
          ./compile-ffmpeg.sh armv7a
          ./compile-ffmpeg.sh arm64
          ./compile-ffmpeg.sh x86
          ./compile-ffmpeg.sh x86_64

      - name: 编译 ijkplayer
        run: |
          export ANDROID_NDK=/root/android-ndk-r14b
          cd /root/ijkplayer/android
          ./compile-ijk.sh armv7a
          ./compile-ijk.sh arm64
          ./compile-ijk.sh x86
          ./compile-ijk.sh x86_64

      - name: 上传 so 产物
        uses: actions/upload-artifact@v4
        with:
          name: ijkplayer-so-hardcode-mp2
          path: /root/ijkplayer/android/ijkplayer/**/*.so
