name: Build ijkplayer (硬解 + MP2)

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    timeout-minutes: 120
    steps:
      - name: 安装依赖
        run: |
          apt-get update
          apt-get install -y git make yasm unzip curl ca-certificates
          # 启用 i386 架构 + 32 位基础库（容器内是 root，无需 sudo）
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y libc6:i386 libstdc++6:i386 zlib1g:i386 || true
          # libncurses5 / libtinfo5：优先 apt，失败则下载 deb 用 dpkg -x 解压
          apt-get install -y libncurses5:i386 libtinfo5:i386 2>/dev/null || true
          if ! ldconfig -p | grep -q "libncurses.so.5"; then
            cd /tmp
            curl -sL -o ti5.deb http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.3_i386.deb
            curl -sL -o nc5.deb http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.3_i386.deb
            ls -la ti5.deb nc5.deb
            dpkg -x ti5.deb /
            dpkg -x nc5.deb /
            ldconfig
          fi
          echo "=== libncurses.so.5 确认 ==="
          ldconfig -p | grep libncurses.so.5

      - name: 下载 Android NDK r14b
        run: |
          cd /root
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip
          unzip -q ndk.zip
          echo "NDK ready: /root/android-ndk-r14b"

      - name: 下载 ijkplayer 源码
        run: |
          cd /root
          git clone --depth 1 --branch k0.8.8 https://github.com/bilibili/ijkplayer.git ijkplayer

      - name: 修改编译配置（启用硬解 + MP2）
        run: |
          cd /root/ijkplayer/config
          rm -f module.sh
          ln -s module-default.sh module.sh
          sed -i 's/--disable-hwaccels//g' module-default.sh
          {
            echo 'export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-mediacodec"'
            echo 'export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-jni"'
            echo 'export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-decoder=mp2"'
            echo 'export COMMON_FF_CFG_FLAGS="$COMMON_FF_CFG_FLAGS --enable-decoder=mp3"'
          } >> module-default.sh
          grep -E "mediacodec|hwaccels|decoder=mp2" module-default.sh || true

      - name: 编译 FFmpeg
        run: |
          export ANDROID_NDK=/root/android-ndk-r14b
          cd /root/ijkplayer
          ./init-android.sh
          cd android/contrib
          ./compile-ffmpeg.sh clean
          ./compile-ffmpeg.sh armv7a
          ./compile-ffmpeg.sh arm64
          ./compile-ffmpeg.sh x86
          ./compile-ffmpeg.sh x86_64

      - name: 编译 ijkplayer
        run: |
          export ANDROID_NDK=/root/android-ndk-r14b
          cd /root/ijkplayer/android
          ./compile-ijk.sh armv7a
          ./compile-ijk.sh arm64
          ./compile-ijk.sh x86
          ./compile-ijk.sh x86_64

      - name: 上传 so 产物
        uses: actions/upload-artifact@v4
        with:
          name: ijkplayer-so-hardcode-mp2
          path: |
            /root/ijkplayer/android/ijkplayer/ijkplayer-arm64/src/main/jniLibs/arm64-v8a/
            /root/ijkplayer/android/ijkplayer/ijkplayer-armv7a/src/main/jniLibs/armeabi-v7a/
            /root/ijkplayer/android/ijkplayer/ijkplayer-x86/src/main/jniLibs/x86/
            /root/ijkplayer/android/ijkplayer/ijkplayer-x86_64/src/main/jniLibs/x86_64/
